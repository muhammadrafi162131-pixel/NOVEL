<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grimoire - Novel to Comic Generator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #121016;
      --bg-panel: #1b1722;
      --border-color: #3d334a;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #e2d9cb;
      --text-muted: #9e92a8;
      --comic-font: 'Bangers', cursive;
      --font-title: 'Cinzel', serif;
      --font-body: 'Lora', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- HEADER --- */
    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: var(--font-title);
      font-size: 1.4rem;
      color: var(--gold-primary);
      letter-spacing: 1px;
    }

    .btn-convert {
      background: linear-gradient(135deg, #8a2be2, #d4af37);
      border: none;
      color: #fff;
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-convert:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* --- LAYOUT UTAMA (SPLIT SCREEN) --- */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
    }

    /* Sisi Kiri: Text Editor Novel */
    .editor-section {
      width: 45%;
      border-right: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background-color: var(--bg-dark);
    }

    .section-title {
      font-family: var(--font-title);
      color: var(--gold-light);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .novel-input {
      flex: 1;
      width: 100%;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 20px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 1.05rem;
      line-height: 1.8;
      resize: none;
      outline: none;
    }

    .novel-input:focus {
      border-color: var(--gold-primary);
    }

    /* Sisi Kanan: Comic Canvas */
    .comic-section {
      width: 55%;
      padding: 20px;
      overflow-y: auto;
      background-color: #0b0a0e;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .comic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    /* Style Panel Komik */
    .comic-panel {
      background-color: #1a1a1a;
      border: 3px solid #000;
      border-radius: 4px;
      height: 320px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* STYLING GAMBAR PANEL BARU */
    .panel-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Fallback Warna Gradient jika gambar lokal belum dimuat */
    .bg-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .bg-panel-1 { background: linear-gradient(45deg, #2b1055, #7597de); }
    .bg-panel-2 { background: linear-gradient(135deg, #4a1212, #e056fd); }
    .bg-panel-3 { background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364); }

    /* Box Keterangan / Narasi (Caption Box) */
    .comic-caption {
      position: relative;
      z-index: 2;
      background-color: #fffbcf;
      color: #000;
      border: 2px solid #000;
      padding: 6px 10px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 0.8rem;
      margin: 8px;
      max-width: 85%;
      box-shadow: 2px 2px 0px #000;
    }

    /* Balon Kata (Speech Bubble) */
    .speech-bubble {
      position: relative;
      z-index: 2;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      border-radius: 12px;
      padding: 8px 12px;
      font-family: var(--comic-font);
      font-size: 1rem;
      letter-spacing: 1px;
      margin: 8px;
      max-width: 80%;
      align-self: flex-end;
      box-shadow: 2px 2px 0px #000;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 15px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #fff transparent;
      display: block;
      width: 0;
    }

    .panel-number {
      position: absolute;
      bottom: 5px;
      left: 5px;
      z-index: 3;
      background: #000;
      color: #fff;
      font-family: var(--comic-font);
      font-size: 0.8rem;
      padding: 2px 6px;
    }

    /* Tombol Unggah Gambar Interaktif */
    .upload-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid var(--gold-primary);
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .upload-btn:hover {
      background: var(--gold-primary);
      color: #000;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">📖 NOVEL TO COMIC STUDIO</div>
    <button class="btn-convert" onclick="generateComic()">✨ Konversi ke Komik</button>
  </header>

  <!-- WORKSPACE MAIN -->
  <div class="workspace">
    
    <!-- SISI KIRI: INPUT NOVEL -->
    <section class="editor-section">
      <div class="section-title">✍️ Naskah Novel (Teks Original)</div>
      <textarea id="novelText" class="novel-input" placeholder="Tulis atau tempel naskah novel fantasimu di sini...">Malam semakin larut di Hutan Hitam. Hujan deras mengguyur pepohonan tua yang menjulang tinggi.

Valerius memegang erat hulu pedangnya. "Aku merasakan keberadaan sihir gelap di sekitar sini," bisiknya pada dirinya sendiri.

Tiba-tiba, mata merah menyala muncul dari balik kegelapan semak-semak. Seekor serigala bayangan melompat dengan raungan keras!</textarea>
    </section>

    <!-- SISI KANAN: OUTPUT KOMIK -->
    <section class="comic-section">
      <div class="section-title">🎨 Hasil Adaptasi Komik</div>
      
      <div class="comic-grid" id="comicContainer">
        
        <!-- Panel 1 -->
        <div class="comic-panel">
          <div class="bg-fallback bg-panel-1"></div>
          <!-- Tag Gambar (Akan mengambil file dari folder img/panel1.png jika ada) -->
          <img src="img/panel1.png" alt="Panel 1" class="panel-image" id="img-panel-1" onerror="this.style.display='none'">
          
          <div class="comic-caption">Hutan Hitam. Hujan deras mengguyur pepohonan tua...</div>
          <span class="panel-number">PANEL 1</span>
          
          <button class="upload-btn" onclick="document.getElementById('file-1').click()">📷 Ganti Gambar</button>
          <input type="file" id="file-1" accept="image/*" style="display:none" onchange="previewImage(event, 'img-panel-1')">
        </div>

        <!-- Panel 2 -->
        <div class="comic-panel">
          <div class="bg-fallback bg-panel-3"></div>
          <img src="img/panel2.png" alt="Panel 2" class="panel-image" id="img-panel-2" onerror="this.style.display='none'">
          
          <div class="speech-bubble">"Aku merasakan keberadaan sihir gelap di sekitar sini..."</div>
          <span class="panel-number">PANEL 2</span>
          
          <button class="upload-btn" onclick="document.getElementById('file-2').click()">📷 Ganti Gambar</button>
          <input type="file" id="file-2" accept="image/*" style="display:none" onchange="previewImage(event, 'img-panel-2')">
        </div>

        <!-- Panel 3 -->
        <div class="comic-panel" style="grid-column: span 2;">
          <div class="bg-fallback bg-panel-2"></div>
          <img src="img/panel3.png" alt="Panel 3" class="panel-image" id="img-panel-3" onerror="this.style.display='none'">
          
          <div class="comic-caption">Tiba-tiba, mata merah menyala muncul dari balik kegelapan!</div>
          <div class="speech-bubble" style="font-size: 1.3rem; color: red;">"GRRRRRRRR...!"</div>
          <span class="panel-number">PANEL 3</span>
          
          <button class="upload-btn" onclick="document.getElementById('file-3').click()">📷 Ganti Gambar</button>
          <input type="file" id="file-3" accept="image/*" style="display:none" onchange="previewImage(event, 'img-panel-3')">
        </div>

      </div>
    </section>

  </div>

  <!-- JAVASCRIPT KONVERSI & UPLOAD GAMBAR -->
  <script>
    // Fungsi untuk memperbarui panel sesuai naskah teks
    function generateComic() {
      const text = document.getElementById('novelText').value;
      const container = document.getElementById('comicContainer');
      
      if (!text.trim()) {
        alert("Harap masukkan naskah novel terlebih dahulu!");
        return;
      }

      const paragraphs = text.split('\n').filter(p => p.trim() !== '');
      container.innerHTML = ''; // Clear panel lama

      const bgClasses = ['bg-panel-1', 'bg-panel-2', 'bg-panel-3'];

      paragraphs.forEach((para, index) => {
        const isDialogue = para.includes('"');
        const bgClass = bgClasses[index % bgClasses.length];
        const panelId = `img-panel-${index + 1}`;
        const fileId = `file-${index + 1}`;

        const panel = document.createElement('div');
        panel.className = 'comic-panel';
        
        // Buat susunan layout komik dengan elemen <img>
        panel.innerHTML = `
          <div class="bg-fallback ${bgClass}"></div>
          <img src="img/panel${index + 1}.png" alt="Panel ${index + 1}" class="panel-image" id="${panelId}" onerror="this.style.display='none'">
          
          ${isDialogue 
            ? `<div class="speech-bubble">${para}</div>` 
            : `<div class="comic-caption">${para}</div>`}
          
          <span class="panel-number">PANEL ${index + 1}</span>
          
          <button class="upload-btn" onclick="document.getElementById('${fileId}').click()">📷 Ganti Gambar</button>
          <input type="file" id="${fileId}" accept="image/*" style="display:none" onchange="previewImage(event, '${panelId}')">
        `;

        container.appendChild(panel);
      });
    }

    // Fungsi JS untuk langsung menampilkan gambar yang di-upload dari komputer
    function previewImage(event, imgElementId) {
      const imgElement = document.getElementById(imgElementId);
      const file = event.target.files[0];
      
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imgElement.src = e.target.result;
          imgElement.style.display = 'block'; // Tampilkan gambar setelah diunggah
        }
        reader.readAsDataURL(file);
      }
    }
  </script>
</body>
</html>
