<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xianxia Realm - Novel Platform</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #121214;
      --bg-card: #1a1a1e;
      --bg-header: #18181c;
      --text-primary: #e4e4e7;
      --text-secondary: #a1a1aa;
      --accent-gold: #d4af37;
      --border-color: #27272a;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      font-family: 'Lora', serif;
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- HEADER --- */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .brand {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* Sign In & Dropdown (Pojok Kanan Atas) */
    .user-menu-container {
      position: relative;
    }

    .btn-auth {
      background-color: var(--accent-gold);
      color: #000;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-auth:hover {
      opacity: 0.9;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 45px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow);
      width: 160px;
      overflow: hidden;
      z-index: 101;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-item {
      padding: 12px 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.2s;
    }

    .dropdown-item:hover {
      background-color: var(--border-color);
      color: var(--accent-gold);
    }

    /* --- MAIN CONTENT AREA --- */
    main {
      flex: 1;
      max-width: 850px;
      width: 90%;
      margin: 40px auto;
      background-color: var(--bg-card);
      padding: 40px 50px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      position: relative;
    }

    @media (max-width: 600px) {
      main { padding: 20px; width: 95%; margin: 20px auto; }
    }

    .section-view {
      display: none;
    }

    .section-view.active {
      display: block;
    }

    /* --- VIEW 1: CREATE NOVEL FORM --- */
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--accent-gold);
    }

    .form-input, .form-textarea {
      background-color: var(--bg-body);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 12px;
      border-radius: 6px;
      font-family: 'Lora', serif;
      font-size: 1rem;
      outline: none;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--accent-gold);
    }

    .form-textarea {
      height: 250px;
      resize: vertical;
      line-height: 1.8;
    }

    .btn-submit {
      background-color: var(--accent-gold);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }

    /* --- VIEW 2: READ NOVEL LIST --- */
    .novel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .novel-card {
      background-color: var(--bg-body);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 160px;
    }

    .novel-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-gold);
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--accent-gold);
    }

    .card-date {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* --- VIEW 3: NOVEL READER PAGE --- */
    .reader-title {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      color: var(--accent-gold);
      text-align: center;
      margin-bottom: 5px;
    }

    .reader-date {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border-color);
    }

    .reader-content p {
      margin-bottom: 20px;
      font-size: 1.1rem;
      text-align: justify;
    }

    /* Pagination / Next Prev Controls */
    .pagination-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .btn-page {
      background-color: var(--bg-body);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 6px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
    }

    .btn-page:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-page:not(:disabled):hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .page-indicator {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    /* --- RATING BINTANG (POJOK KIRI BAWAH) --- */
    .rating-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      display: none; /* Muncul hanya saat membaca novel */
      flex-direction: column;
      gap: 4px;
      z-index: 99;
    }

    .rating-container.show {
      display: flex;
    }

    .rating-label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .stars {
      display: flex;
      gap: 5px;
      cursor: pointer;
    }

    .star {
      font-size: 1.3rem;
      color: var(--text-secondary);
      transition: color 0.2s;
    }

    .star.active {
      color: var(--accent-gold);
    }

    /* Default Welcome Message */
    .welcome-text {
      text-align: center;
      padding: 40px 0;
      color: var(--text-secondary);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand" onclick="showWelcome()">📖 XIANXIA REALM</div>
    
    <!-- User Sign In / Dropdown Menu -->
    <div class="user-menu-container">
      <button class="btn-auth" id="authBtn" onclick="toggleAuth()">Sign In</button>
      <div class="dropdown-menu" id="dropdownMenu">
        <div class="dropdown-item" onclick="openSection('createSection')">✍️ Create</div>
        <div class="dropdown-item" onclick="openSection('readSection')">📚 Read</div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main>
    <!-- WELCOME / DEFAULT -->
    <div id="welcomeSection" class="section-view active">
      <div class="welcome-text">
        <h2>Selamat Datang di Platform Novel</h2>
        <p style="margin-top: 10px;">Klik tombol <b>Sign In</b> di pojok kanan atas untuk mulai menulis (Create) atau membaca (Read) novel.</p>
      </div>
    </div>

    <!-- 1. VIEW CREATE NOVEL -->
    <div id="createSection" class="section-view">
      <h2 style="font-family: 'Cinzel', serif; color: var(--accent-gold); margin-bottom: 20px;">Tulis Novel Baru</h2>
      <form onsubmit="saveNovel(event)">
        <div class="form-group">
          <label for="novelTitle">Judul Novel</label>
          <input type="text" id="novelTitle" class="form-input" placeholder="Masukkan judul novel..." required>
        </div>
        <div class="form-group">
          <label for="novelDate">Tanggal Pembuatan</label>
          <input type="date" id="novelDate" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="novelContent">Isi Novel</label>
          <textarea id="novelContent" class="form-textarea" placeholder="Tuliskan cerita novel secara manual di sini..." required></textarea>
        </div>
        <button type="submit" class="btn-submit">Simpan & Publikasikan Novel</button>
      </form>
    </div>

    <!-- 2. VIEW READ (DAFTAR NOVEL) -->
    <div id="readSection" class="section-view">
      <h2 style="font-family: 'Cinzel', serif; color: var(--accent-gold);">Daftar Novel</h2>
      <div class="novel-grid" id="novelListContainer">
        <!-- List Novel akan muncul di sini secara otomatis -->
      </div>
    </div>

    <!-- 3. VIEW READER (BACA NOVEL & PAGINATION) -->
    <div id="readerSection" class="section-view">
      <h1 class="reader-title" id="displayTitle">Judul Novel</h1>
      <div class="reader-date" id="displayDate">Tanggal: -</div>
      
      <div class="reader-content" id="displayContent">
        <!-- Teks Halaman Novel Dimuat di Sini -->
      </div>

      <!-- Navigasi Lembar/Halaman Next -->
      <div class="pagination-controls">
        <button class="btn-page" id="prevBtn" onclick="changePage(-1)">← Prev</button>
        <span class="page-indicator" id="pageIndicator">Halaman 1 dari 1</span>
        <button class="btn-page" id="nextBtn" onclick="changePage(1)">Next →</button>
      </div>
    </div>
  </main>

  <!-- RATING BINTANG (POJOK KIRI BAWAH) -->
  <div class="rating-container" id="ratingContainer">
    <span class="rating-label">Beri Rating Novel Ini:</span>
    <div class="stars">
      <span class="star" onclick="setRating(1)">★</span>
      <span class="star" onclick="setRating(2)">★</span>
      <span class="star" onclick="setRating(3)">★</span>
      <span class="star" onclick="setRating(4)">★</span>
      <span class="star" onclick="setRating(5)">★</span>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // State Aplikasi
    let isSignedIn = false;
    let novels = JSON.parse(localStorage.getItem('userNovels')) || [
      {
        title: "Lautan Bintang di Atas Dongshan",
        date: "2026-07-30",
        content: `Angin gunung menderu kasar, menerbangkan helai-helai rambut hitam seorang pemuda yang duduk terpaku di tepi tebing curam. Namanya Lin Feng. Tepatnya, nama barunya.\n\nLima menit yang lalu, dia masih seorang editor komik di Beijing yang sedang memegangi cangkir kopi ketiganya pada pukul tiga pagi, mengumpat pada tenggat waktu bab terbaru sebuah manhua kultivasi. Detik berikutnya, penglihatannya gelap, dadanya sesak, dan ketika dia membuka mata... dunia telah berubah menjadi hamparan pegunungan hijau yang melayang di atas awan.\n\n"Aku... mati karena lembur? Dan sekarang aku bertransmigrasi?" gumam Lin Feng ternganga.\n\nSebelum dia sempat memproses krisis eksistensial ini, sebuah suara mekanis yang dingin dan tanpa emosi tiba-tiba meledak di dalam kepalanya.\n\n[Ding! Sistem Drama Manhua Kuno telah berhasil terikat dengan jiwa Anda!]\n[Host terpilih: Lin Feng (Murid Sekte Luar Sekte Pedang Hijau)]\n[Kondisi Tubuh: Nol Kultivasi, Bakat Sampah, Pemalas, Kurang Gizi.]\n\nLin Feng langsung menegakkan tubuhnya. Matanya berbinar. Sebagai pembaca ribuan fiksi transmigrasi, dia tahu apa artinya ini. "Sistem! Berikan aku kekuatan instan!"`
      }
    ];

    let currentNovel = null;
    let currentNovelPages = [];
    let currentPageIndex = 0;
    const WORDS_PER_PAGE = 80; // Batas kata per lembar halaman

    // 1. Toggle Sign In & Dropdown Menu
    function toggleAuth() {
      const authBtn = document.getElementById('authBtn');
      const dropdownMenu = document.getElementById('dropdownMenu');

      if (!isSignedIn) {
        isSignedIn = true;
        authBtn.innerText = "User Menu ▼";
        dropdownMenu.classList.add('show');
      } else {
        dropdownMenu.classList.toggle('show');
      }
    }

    // Navigasi Tampilan Section
    function openSection(sectionId) {
      document.querySelectorAll('.section-view').forEach(sec => sec.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      document.getElementById('dropdownMenu').classList.remove('show');
      document.getElementById('ratingContainer').classList.remove('show'); // Sembunyikan rating jika bukan di halaman baca

      if (sectionId === 'readSection') {
        renderNovelList();
      }
    }

    function showWelcome() {
      openSection('welcomeSection');
    }

    // 2. Simpan Novel Baru (Form Create)
    function saveNovel(e) {
      e.preventDefault();
      const title = document.getElementById('novelTitle').value;
      const date = document.getElementById('novelDate').value;
      const content = document.getElementById('novelContent').value;

      const newNovel = { title, date, content };
      novels.push(newNovel);
      localStorage.setItem('userNovels', JSON.stringify(novels));

      alert('Novel berhasil dipublikasikan!');
      document.getElementById('novelTitle').value = '';
      document.getElementById('novelContent').value = '';
      
      openSection('readSection');
    }

    // 3. Render Daftar Novel (Read View)
    function renderNovelList() {
      const container = document.getElementById('novelListContainer');
      container.innerHTML = '';

      if (novels.length === 0) {
        container.innerHTML = `<p style="color:var(--text-secondary);">Belum ada novel yang dibuat.</p>`;
        return;
      }

      novels.forEach((novel, index) => {
        const card = document.createElement('div');
        card.className = 'novel-card';
        card.innerHTML = `
          <div class="card-title">${novel.title}</div>
          <div class="card-date">🗓️ ${novel.date}</div>
        `;
        card.onclick = () => readNovel(index);
        container.appendChild(card);
      });
    }

    // 4. Buka Novel & Sistem Halaman (Pagination)
    function readNovel(index) {
      currentNovel = novels[index];
      currentPageIndex = 0;

      // Memotong teks novel yang panjang menjadi beberapa lembar halaman
      const paragraphs = currentNovel.content.split('\n\n');
      currentNovelPages = [];
      let currentPageText = "";
      let wordCount = 0;

      paragraphs.forEach(p => {
        const pWordCount = p.split(' ').length;
        if (wordCount + pWordCount > WORDS_PER_PAGE && currentPageText !== "") {
          currentNovelPages.push(currentPageText);
          currentPageText = p + "\n\n";
          wordCount = pWordCount;
        } else {
          currentPageText += p + "\n\n";
          wordCount += pWordCount;
        }
      });
      if (currentPageText.trim() !== "") {
        currentNovelPages.push(currentPageText);
      }

      // Tampilkan data ke layar reader
      document.getElementById('displayTitle').innerText = currentNovel.title;
      document.getElementById('displayDate').innerText = `Dibuat pada: ${currentNovel.date}`;
      
      renderPage();
      openSection('readerSection');
      
      // Tampilkan kolom rating di pojok kiri bawah saat membaca
      document.getElementById('ratingContainer').classList.add('show');
      resetRatingStars();
    }

    // Tampilkan isi lembar halaman aktif
    function renderPage() {
      const displayContent = document.getElementById('displayContent');
      const pageText = currentNovelPages[currentPageIndex] || "";
      
      displayContent.innerHTML = pageText
        .split('\n\n')
        .map(paragraph => `<p>${paragraph}</p>`)
        .join('');

      // Update Indikator & Button Next/Prev
      document.getElementById('pageIndicator').innerText = `Halaman ${currentPageIndex + 1} dari ${currentNovelPages.length}`;
      document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
      document.getElementById('nextBtn').disabled = (currentPageIndex === currentNovelPages.length - 1);
    }

    function changePage(direction) {
      currentPageIndex += direction;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 5. Fitur Rating Bintang
    function setRating(rating) {
      const stars = document.querySelectorAll('.star');
      stars.forEach((star, index) => {
        if (index < rating) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      });
      alert(`Terima kasih! Kamu memberikan rating ${rating} bintang.`);
    }

    function resetRatingStars() {
      document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
    }
  </script>
</body>
</html>
