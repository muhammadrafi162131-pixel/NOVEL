<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel to Comic Studio - Lautan Bintang di Atas Dongshan</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #121016;
      --bg-panel: #1b1722;
      --border-color: #3d334a;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #e2d9cb;
      --text-muted: #9e92a8;
      --comic-font: 'Bangers', cursive;
      --font-title: 'Cinzel', serif;
      --font-body: 'Lora', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- HEADER --- */
    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: var(--font-title);
      font-size: 1.4rem;
      color: var(--gold-primary);
      letter-spacing: 1px;
    }

    .btn-convert {
      background: linear-gradient(135deg, #8a2be2, #d4af37);
      border: none;
      color: #fff;
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-convert:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* --- LAYOUT UTAMA (SPLIT SCREEN) --- */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
    }

    /* Sisi Kiri: Text Editor Novel */
    .editor-section {
      width: 45%;
      border-right: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background-color: var(--bg-dark);
    }

    .section-title {
      font-family: var(--font-title);
      color: var(--gold-light);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .novel-input {
      flex: 1;
      width: 100%;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 20px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 0.95rem;
      line-height: 1.7;
      resize: none;
      outline: none;
    }

    .novel-input:focus {
      border-color: var(--gold-primary);
    }

    /* Sisi Kanan: Comic Canvas */
    .comic-section {
      width: 55%;
      padding: 20px;
      overflow-y: auto;
      background-color: #0b0a0e;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .comic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    /* Style Panel Komik */
    .comic-panel {
      background-color: #1a1a1a;
      border: 3px solid #000;
      border-radius: 4px;
      min-height: 320px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* STYLING GAMBAR PANEL */
    .panel-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Fallback Warna Gradient jika gambar lokal belum dimuat */
    .bg-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .bg-panel-1 { background: linear-gradient(45deg, #1e053a, #4a1c6d); }
    .bg-panel-2 { background: linear-gradient(135deg, #4a1212, #8b0000); }
    .bg-panel-3 { background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364); }
    .bg-panel-4 { background: linear-gradient(135deg, #2c3e50, #fd79a8); }
    .bg-panel-5 { background: linear-gradient(45deg, #111, #444); }

    /* Box Keterangan / Narasi (Caption Box) */
    .comic-caption {
      position: relative;
      z-index: 2;
      background-color: #fffbcf;
      color: #000;
      border: 2px solid #000;
      padding: 6px 10px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 0.8rem;
      margin: 8px;
      max-width: 85%;
      box-shadow: 2px 2px 0px #000;
    }

    /* Balon Kata (Speech Bubble) */
    .speech-bubble {
      position: relative;
      z-index: 2;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      border-radius: 12px;
      padding: 8px 12px;
      font-family: var(--comic-font);
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      margin: 8px;
      max-width: 85%;
      align-self: flex-end;
      box-shadow: 2px 2px 0px #000;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 15px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #fff transparent;
      display: block;
      width: 0;
    }

    .panel-number {
      position: absolute;
      bottom: 5px;
      left: 5px;
      z-index: 3;
      background: #000;
      color: #fff;
      font-family: var(--comic-font);
      font-size: 0.8rem;
      padding: 2px 6px;
    }

    /* Tombol Unggah Gambar Interaktif */
    .upload-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 4;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid var(--gold-primary);
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .upload-btn:hover {
      background: var(--gold-primary);
      color: #000;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">📖 NOVEL TO COMIC STUDIO</div>
    <button class="btn-convert" onclick="generateComic()">✨ Konversi ke Komik</button>
  </header>

  <!-- WORKSPACE MAIN -->
  <div class="workspace">
    
    <!-- SISI KIRI: INPUT NOVEL FULL -->
    <section class="editor-section">
      <div class="section-title">✍️ Naskah Novel (Teks Original)</div>
      <textarea id="novelText" class="novel-input" placeholder="Tulis atau tempel naskah novel fantasimu di sini...">LAUTAN BINTANG DI ATAS DONGSHAN

Angin gunung menderu kasar, menerbangkan helai-helai rambut hitam seorang pemuda yang duduk terpaku di tepi tebing curam. Namanya Lin Feng. Tepatnya, nama barunya.

Lima menit yang lalu, dia masih seorang editor komik di Beijing yang sedang memegangi cangkir kopi ketiganya pada pukul tiga pagi, mengumpat pada tenggat waktu bab terbaru sebuah manhua kultivasi. Detik berikutnya, penglihatannya gelap, dadanya sesak, dan ketika dia membuka mata... dunia telah berubah menjadi hamparan pegunungan hijau yang melayang di atas awan.

Lin Feng menatap jubah abu-abunya yang compang-camping dan telapak tangannya yang kasar. "Aku... mati karena lembur? Dan sekarang aku bertransmigrasi?"

Ding!
[Sistem Drama Manhua Kuno telah berhasil terikat dengan jiwa Anda!]
[Misi Utama Episode 1: "Tuan Muda Sombong Menghina Protagonis Miskin". Target: Wang Ba. Hadiah: Ranah Pengumpulan Qi Tingkat 1. Hukuman Gagal: Efek 'Rambut Rontok Permanen'.]

Lin Feng ternganga. "Sistem bajingan! Kenapa aku malah harus mengemis untuk dihina?!"

Dengan langkah seribu, Lin Feng berlari menuju Pasar Sekte Luar. Di depan toko obat spiritual, berdiri Wang Ba dengan jubah hijau mewah memamerkan Buah Roh Merah.

Sekarang atau botak!
Lin Feng sengaja mempercepat langkahnya, dan—BRAK! Dia menabrak Wang Ba hingga Buah Roh Merah jatuh ke kubangan lumpur.

"BAJINGAN!" raung Wang Ba. "Matamu ditaruh di mana, Pemuda Miskin?! Mengemis sepuluh turunan pun kamu tidak akan bisa menggantinya!"

Lin Feng tersenyum sangat lebar menikmati sensasi naik level. Reaksi ini membuat Wang Ba paranoid. "C-Cih! Hari ini suasana hatiku sedang buruk! Ayo pergi!" teriak Wang Ba lalu kabur.

Keesokan paginya, Lin Feng dipanggil ke Aula Penegakan Disiplin. Tetua Mo menatapnya tajam. "Kudengar kamu menyembunyikan basis kultivasimu. Siapa yang mengirimmu?"

Lin Feng langsung menahan napas, menggigit pipinya, dan... SPROOOTTT! Dia menyemburkan darah segar ke lantai batu. "Tetua Mo... murid ini memiliki penyakit bawaan... Saya tidak menyangka Tetua juga akan mencurigai murid yang sekarat ini..."

Tetua Mo panik dan merasa bersalah. "Maafkan orang tua ini, Lin Feng! Ini Pil Pemulih Darah, bawalah pulang."

Di pondoknya, tunangannya Liu Ruoxian datang. Lin Feng langsung memasang pose dramatis. "Aku yang menceraikanmu! Ingat kalimat ini: Tiga puluh tahun di Sungai Timur, tiga puluh tahun di Sungai Barat, jangan pernah meremehkan pemuda yang miskin!"

Namun Liu Ruoxian justru menangis terharu. "Lin Feng... tulang punggungmu begitu tegak... Aku bersumpah akan melindungimu!"

Di Kompetisi Sekte Luar, Lin Feng tampil dengan kain hitam berlubang di wajahnya sebagai "Pendekar Kain Hitam". Saat Lu Chen menyerang, Lin Feng menangkap pedangnya dengan dua jari hingga PATAH!

"Jurus... Menangkap Pedang dengan Dua Jari?!" seru Tetua Mo ternganga.

Tepat saat babak final dimulai, langit berubah menjadi merah darah. Awan gelap menggulung dan tawa iblis bergema. Aliansi Iblis telah menyerang sekte!</textarea>
    </section>

    <!-- SISI KANAN: OUTPUT KOMIK AUTOMATIS -->
    <section class="comic-section">
      <div class="section-title">🎨 Hasil Adaptasi Komik</div>
      <div class="comic-grid" id="comicContainer">
        <!-- Panel komik akan di-generate otomatis oleh Script -->
      </div>
    </section>

  </div>

  <!-- JAVASCRIPT KONVERSI NOVEL KE KOMIK -->
  <script>
    // Jalankan otomatis saat halaman pertama kali dimuat
    window.onload = function() {
      generateComic();
    };

    function generateComic() {
      const text = document.getElementById('novelText').value;
      const container = document.getElementById('comicContainer');
      
      if (!text.trim()) {
        alert("Harap masukkan naskah novel terlebih dahulu!");
        return;
      }

      // Memecah naskah paragraf demi paragraf
      const rawParagraphs = text.split('\n').filter(p => p.trim() !== '');
      container.innerHTML = ''; // Clear panel lama

      const bgClasses = ['bg-panel-1', 'bg-panel-2', 'bg-panel-3', 'bg-panel-4', 'bg-panel-5'];

      rawParagraphs.forEach((para, index) => {
        const isDialogue = para.includes('"') || para.includes('[') || para.startsWith('Ding!');
        const bgClass = bgClasses[index % bgClasses.length];
        const panelId = `img-panel-${index + 1}`;
        const fileId = `file-${index + 1}`;
        const panelNumber = index + 1;

        // Tentukan gambar default berdasarkan panel (mengacu pada folder img/panelX.png)
        const defaultImgSrc = `img/panel${panelNumber}.png`;

        const panel = document.createElement('div');
        panel.className = 'comic-panel';
        
        // Memperluas panel khusus adegan penting/climax (contoh: adegan berteriak / final)
        if (para.includes("SPROOOTTT") || para.includes("Aliansi Iblis") || para.includes("BAJINGAN")) {
          panel.style.gridColumn = "span 2";
        }

        // Template Struktur Panel Komik
        panel.innerHTML = `
          <div class="bg-fallback ${bgClass}"></div>
          <img src="${defaultImgSrc}" alt="Panel ${panelNumber}" class="panel-image" id="${panelId}" onerror="this.style.display='none'">
          
          ${isDialogue 
            ? `<div class="speech-bubble">${escapeHtml(para)}</div>` 
            : `<div class="comic-caption">${escapeHtml(para)}</div>`}
          
          <span class="panel-number">PANEL ${panelNumber}</span>
          
          <button class="upload-btn" onclick="document.getElementById('${fileId}').click()">📷 Ganti Gambar</button>
          <input type="file" id="${fileId}" accept="image/*" style="display:none" onchange="previewImage(event, '${panelId}')">
        `;

        container.appendChild(panel);
      });
    }

    // Helper untuk menghindari error HTML Injection pada karakter khusus
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Fungsi JS untuk preview gambar yang di-upload dari komputer
    function previewImage(event, imgElementId) {
      const imgElement = document.getElementById(imgElementId);
      const file = event.target.files[0];
      
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imgElement.src = e.target.result;
          imgElement.style.display = 'block'; // Tampilkan gambar setelah diunggah
        }
        reader.readAsDataURL(file);
      }
    }
  </script>
</body>
</html>
